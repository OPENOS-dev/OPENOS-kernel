- name: 构建并打包 binpkg
        run: |
          set -euo pipefail
          # 全程输出写入日志文件 (供失败上报 step 读取)
          exec > >(tee "$RUNNER_TEMP/build.log") 2>&1
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in
            x86-64) TARGET=x86_64-openos-linux-gnu; CROSS="" ;;
            x86)    TARGET=i686-openos-linux-gnu;   CROSS="" ;;
            arm64)  TARGET=aarch64-openos-linux-gnu;  CROSS=aarch64-linux-gnu- ;;
            arm32)  TARGET=armv7h-openos-linux-gnueabihf; CROSS=arm-linux-gnueabihf- ;;
            loong64)TARGET=loongarch64-openos-linux-gnu; CROSS=loongarch64-linux-gnu- ;;
          esac
          export TARGET CROSS
          WORK="$(mktemp -d)"
          PKG="$WORK/${COMPONENT}-${ARCH}-DEV2026.1.pkg.tar.zst"
          
          # 内核分层 (默认 base=6.12.103)
          case "$KERNEL_TIER" in
            classic) KDIR=linux-5.15.215 ;;
            base7)   KDIR=linux-7.1.8 ;;
            preview) KDIR=linux-7.2-rc7 ;;
            *)       KDIR=linux-6.12.103 ;;
          esac
          case "$ARCH" in
            x86-64) KARCH=x86_64 ;;
            x86)    KARCH=i386 ;;
            arm64)  KARCH=arm64 ;;
            arm32)  KARCH=arm ;;
            loong64) KARCH=loongarch ;;
          esac
          [ -d "$KDIR" ] || { echo "::error::内核目录缺失: $KDIR"; exit 1; }
          mkdir -p "$WORK/out"
          cd "$KDIR"

          # 1. 配置内核
          make O="$WORK/out" ARCH="$KARCH" ${CROSS:+CROSS_COMPILE=$CROSS} defconfig >/dev/null
          scripts/config --file "$WORK/out/.config" -e SECURITY -e SECURITY_OPENOS -e MODULES
          make O="$WORK/out" ARCH="$KARCH" ${CROSS:+CROSS_COMPILE=$CROSS} olddefconfig >/dev/null

          # 2. 【关键修复】优先顺序预编译 prepare 依赖，防止 -j 并行导致 module.lds / vdso32.lds 丢失
          make O="$WORK/out" ARCH="$KARCH" ${CROSS:+CROSS_COMPILE=$CROSS} prepare modules_prepare >/dev/null

          # 3. 开启多线程并行编译
          make O="$WORK/out" ARCH="$KARCH" ${CROSS:+CROSS_COMPILE=$CROSS} -j$(nproc) all >/dev/null
          make O="$WORK/out" ARCH="$KARCH" ${CROSS:+CROSS_COMPILE=$CROSS} INSTALL_MOD_PATH="$WORK/pkg" modules_install >/dev/null
          
          mkdir -p "$WORK/pkg/boot"
          cp "$WORK/out/arch/$KARCH/boot/"* "$WORK/pkg/boot/" 2>/dev/null || true
          cp "$WORK/out/System.map" "$WORK/pkg/boot/System.map" 2>/dev/null || true
          
          # 4. 打包
          cd "$WORK"
          mkdir -p "$WORK/pkg"
          tar --zstd -cf "$PKG" -C "$WORK/pkg" .
          ls -la "$PKG"
